plugins {
    id "architectury-plugin" version "3.4-SNAPSHOT"
    id "dev.architectury.loom" version "1.10-SNAPSHOT" apply false
    id "com.hypherionmc.modutils.modpublisher" version "2.2.3" apply false
    id 'com.gradleup.shadow' version '8.3.6' apply false
}

architectury {
    minecraft = minecraft_version
}

allprojects {
    apply plugin: "java"
    apply plugin: "architectury-plugin"
    apply plugin: "maven-publish"

    base.archivesName = mod_id
    version = mod_version
    group = maven_group

    repositories {

        flatDir {
            dirs 'mods'
        }

        mavenLocal()
        if (!maven_backup.toBoolean()) maven { url = "https://registry.somethingcatchy.net/repository/maven-releases/" } // Moonlight & EveryComp
        maven { url "https://maven.parchmentmc.org" }
        maven {
            url = "https://www.cursemaven.com"
            allowInsecureProtocol = true
        }
        maven { url = 'https://jitpack.io' } // BCLib
        maven { url = "https://api.modrinth.com/maven" }
        maven { url = "https://mvn.devos.one/snapshots/" } // registrate_fabric & registrate
        maven { url = "https://mvn.devos.one/releases" } // Porting Lib Releases
        maven { url = "https://maven.shedaniel.me/" } // Cloth Config
        // Required for Create
        maven { url = "https://maven.createmod.net" } // Create, Ponder, Flywheel
        maven { url = "https://maven.tterrag.com" } // Registrate
        maven { url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/" } // Forge Config API Port
        maven { // Reach Entity Attributes
            url = "https://maven.jamieswhiteshirt.com/libs-release"
            content { includeGroup("com.jamieswhiteshirt") }
        }
        maven { // CC: Tweaked
            url = "https://squiddev.cc/maven"
        }
        maven { // Unknown
            name = 'Ladysnake Mods'
            url = 'https://maven.ladysnake.org/releases'
        }
        maven { // JEI
            name = "Jared's maven"
            url = "https://maven.blamejared.com/"
        }
        maven { // Botania & FALLBACK for JEI
            name = "ModMaven"
            url = "https://modmaven.dev"
        }
        maven { // Chipped
            url = "https://maven.teamresourceful.com/repository/maven-public/"
        }
        maven {
            url = "https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/"
            content {
                includeGroupByRegex("software\\.bernie.*")
                includeGroup("com.eliotlash.mclib")
            }
        } // GeckoLib
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = "UTF-8"
        options.release = 17
    }

    java {
        withSourcesJar()
    }
}

subprojects {
    apply plugin: "dev.architectury.loom"
//    apply plugin: "com.matthewprenger.cursegradle"
//    apply plugin: "com.modrinth.minotaur"
    apply plugin: "com.hypherionmc.modutils.modpublisher"
    apply plugin: "com.gradleup.shadow"

    loom {
        silentMojangMappingsLicense()
    }

    dependencies {
        minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
        // The following line declares the mojmap mappings, you may use other mappings as well
        mappings loom.layered() {
            it.officialMojangMappings {
                setNameSyntheticMembers(false)
            }
            it.parchment("org.parchmentmc.data:parchment-${rootProject.parchment_version}")
        }
    }

    var env = System.getenv()
    var modLoader = name

    var changelogFile = rootProject.file("changelog.md")
    var changelogText = changelogFile.exists() ? changelogFile.text : ""

    publisher {
        apiKeys {
            modrinth env.MODRINTH_TOKEN ?: ""
            curseforge env.CURSEFORGE_TOKEN ?: ""
        }

//        setDebug(true)

        setModrinthID(modrinth_id)
        setCurseID(curseforge_id)

        setGameVersions(minecraft_version)
        setLoaders(modLoader)
        setChangelog(changelogText)
        setProjectVersion("${mod_version}-${modLoader}")
        setVersionType(release_type)
        setCurseEnvironment("both")

        setArtifact(tasks.remapJar)
        addAdditionalFile(tasks.remapSourcesJar)

        if (modLoader == "fabric") {
            setDisplayName("${mod_id}-${mod_version}-fabric")
            modrinthDepends {
                required("fabric-api", "moonlight", "every-compat")
            }

            curseDepends {
                required("fabric-api", "selene", "every-compat")

                optional("additional-lights")
                optional("building-but-better")
                optional("better-archeology")
                optional("create-fabric")
                optional("decorative-blocks")
                optional("fabric-waystones")
                optional("handcrafted")
                optional("lets-do-candlelight")
                optional("macaws-bridges")
                optional("macaws-fences-and-walls")
                optional("macaws-paths-and-pavings")
                optional("macaws-roofs")
                optional("macaws-windows")
                optional("macaws-stairs")
                optional("more-beautiful-torches")
                optional("stoneworks")
                optional("twigs")
                optional("rechiseled")
                optional("waystones")

//              optional("mighty-mail-fabric")
            }
        }
        //!! FORGE
        else {
            setDisplayName("${mod_id}-${mod_version}-forge")
            modrinthDepends {
                required("moonlight", "every-compat")
            }

            curseDepends {
                required("selene", "every-compat")

                optional("additional-lights")
                optional("better-archeology")
                optional("blocks-you-need")
                optional("blockus")
                optional("buildersaddition")
                optional("building-but-better")
                optional("create")
                optional("decorative-blocks")
                optional("handcrafted")
                optional("lets-do-candlelight")
                optional("macaws-bridges")
                optional("macaws-fences-and-walls")
                optional("macaws-paths-and-pavings")
                optional("macaws-roofs")
                optional("macaws-windows")
                optional("macaws-stairs")
                optional("more-beautiful-torches")
                optional("quark")
                optional("stone-chest")
                optional("stoneworks")
                optional("twigs")
                optional("rechiseled")
                optional("waystones")

//              optional("corail-pillar")
//              optional("mighty-mail")

            }
        }
    }
}

tasks.register('buildAndPublishAll') {
    dependsOn ':clean'
    dependsOn ':common:clean'
    dependsOn ':fabric:clean'
    dependsOn ':forge:clean'
    dependsOn ':build'
    dependsOn ':fabric:publishMod'
    dependsOn ':forge:publishMod'
    dependsOn ':publish'
    finalizedBy 'gitTag'

    group = 'build'
    description = 'Runs clean, build, and publish forge and fabric'
}

tasks.register('gitTag') {
    group = 'release'
    description = 'Create and push git tag from project version'

    doLast {
        def execOps = services.get(ExecOperations)
        def tag = project.version.toString()
        // check if tag already exists
        def stdout = new ByteArrayOutputStream()

        execOps.exec {
            commandLine('git', 'tag', '-l', tag)
            standardOutput = stdout
            ignoreExitValue = true
        }

        if (!stdout.toString().trim().isEmpty()) {
            logger.warn("Git tag '${tag}' already exists")
        } else {

            // create annotated tag
            execOps.exec {
                commandLine('git', 'tag', '-a', tag, '-m', "Release ${tag}")
            }

            // push tag
            execOps.exec {
                commandLine('git', 'push', 'origin', tag)
            }
        }
    }
}

tasks.register('cleanLogs', Delete) {
    group "build"
    description "Delete logs"

    // Logs
    delete fileTree(dir: "$rootDir/forge/run/logs", include: "**/*.gz")
    delete fileTree(dir: "$rootDir/fabric/run/logs", include: "**/*.gz")
}

tasks.register('cleanFolders', Delete) {
    group "build"
    description "Clean logs & Delete folders of Debug"

    // Logs
    delete fileTree(dir: "$rootDir/forge/run/logs", include: "**/*.gz")
    delete fileTree(dir: "$rootDir/fabric/run/logs", include: "**/*.gz")

    // Debug
    delete "$rootDir/forge/run/debug"
    delete "$rootDir/fabric/run/debug"
}


